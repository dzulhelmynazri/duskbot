# /etc/logrotate.d/madani: the prozessor logs of the madani.bot apps (deployd names them madani-*). copytruncate because the
# writer keeps its file open; nginx's own logs are rotated by the distribution's nginx rule.
/root/autorunner/logs/madani-*.log /root/autorunner/logs/omb-link.log {
  daily
  rotate 14
  maxsize 100M
  missingok
  notifempty
  compress
  delaycompress
  copytruncate
  dateext
}
